<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyber Neon Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1f"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe600"/>
      <stop offset="70%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="40%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#00f7ff"/>
    </linearGradient>

    <!-- High-Voltage Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Chassis (Rounded Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>

  <!-- Cyberpunk Tech Border Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="18" stroke-opacity="0.9"/>
  
  <!-- Subtle Grid Accent Lines -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00f7ff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#ff0055" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Tactical Chronometer / Clock Ticks -->
  <g stroke="#00f7ff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <!-- 12 O'clock -->
    <line x1="256" y1="90" x2="256" y2="120" stroke="#ffe600" stroke-width="8"/>
    <!-- 3 O'clock -->
    <line x1="422" y1="256" x2="392" y2="256" stroke="#ff0055" stroke-width="8"/>
    <!-- 6 O'clock -->
    <line x1="256" y1="422" x2="256" y2="392" stroke="#ff0055" stroke-width="8"/>
    <!-- 9 O'clock -->
    <line x1="90" y1="256" x2="120" y2="256" stroke="#00f7ff" stroke-width="8"/>
  </g>

  <!-- Speedometer / Overclock Dial Gauge Arc -->
  <path d="M 130 360 A 160 160 0 1 1 382 360" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Dial Sub-Arc Pulse Marks -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#00f7ff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="14 12"/>

  <!-- Overclock Central Lightning Bolt Surge -->
  <!-- Crisp high-velocity lightning silhouette that cuts through the clock dial -->
  <polygon points="280,72 172,260 252,260 216,440 352,232 268,232"
           fill="url(#boltGrad)"
           filter="url(#intenseGlow)"/>

  <!-- Inner High-Intensity Core Highlight -->
  <polygon points="274,104 196,252 258,252 232,392 328,240 262,240"
           fill="#ffffff"
           opacity="0.8"/>

  <!-- Corner Tech Brackets (Cyber HUD Aesthetics) -->
  <path d="M 64 120 L 64 64 L 120 64" fill="none" stroke="#00f7ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M 392 64 L 448 64 L 448 120" fill="none" stroke="#ff0055" stroke-width="7" stroke-linecap="round"/>
  <path d="M 448 392 L 448 448 L 392 448" fill="none" stroke="#00f7ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M 120 448 L 64 448 L 64 392" fill="none" stroke="#ff0055" stroke-width="7" stroke-linecap="round"/>
</svg>
